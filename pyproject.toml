[project]
name = "dclabagent"
version = "0.1.0"
description = "A reference lab for reviewing an assistant integration: a weak and a hardened MCP server, one attack suite, a pass/fail rubric."
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
evidence = ["playwright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
